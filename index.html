<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        header.banner {
            background-color: #888888;
            color: white;
            text-align: center;
            padding: 80px 20px;
        }
        .banner h1 {
            font-size: 64px;
            margin-bottom:20px;
        }
        .banner .desc {
            font-size:28px;
        }
        main {
            max-width:900px;
            margin:0 auto;
            padding:60px 20px;
        }
        .post-item {
            padding:30px 0;
            border-bottom:1px solid #ccc;
        }
        .post-item h2 {
            font-size:42px;
            color:#222;
            margin-bottom:12px;
        }
        .post-item a{
            color:#222;
            text-decoration:none;
        }
        .post-item .date {
            font-size:20px;
            color:#777;
        }
        .pagination {
            margin-top:50px;
            display:flex;
            justify-content:center;
            gap:60px;
        }
        .pagination button {
            background:none;
            border:none;
            font-size:24px;
            cursor:pointer;
            color:#222;
        }
        .pagination button:disabled {
            color:#aaa;
            cursor:default;
        }
    </style>
</head>
<body>
    <header class="banner">
        <h1>我的个人博客</h1>
        <div class="desc">关注：编程、学习笔记</div>
    </header>
    <main>
        <div class="post-list">
            <div class="post-item">
                <h2><a href=" ">第一篇博客</a ></h2>
                <div class="date">2026‑09‑13</div>
            </div>
        </div>
        <div class="pagination">
            <button disabled>&lt;</button>
            <button disabled>&gt;</button>
        </div>
    </main>
</body>
</html>
